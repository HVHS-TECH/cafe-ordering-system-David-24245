<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<title>Cafe Menu</title>
</head>
<body>

    <img src="Images/CafeBanner.png" alt="Cafe Banner" class="CafeBanner">

    <div class="menuGrid">
        <div class="menuCard">
            <img src="Images/croissant.png" alt="Croissant" class="menuImage">
            <div class="menuRow">
                <span class="menuNumber">1.</span>
                <span class="menuName">Croissant</span>
                <span class="menuPrice">$6</span>
            </div>
        <div class="menuText">anvbnon</div>
    </div>

    <div class="menuCard">
        <img src="Images/bagel.png" alt="Bagel" class="menuImage">
            <div class="menuRow">
                <span class="menuNumber">2.</span>
                <span class="menuName">Bagel</span>
                <span class="menuPrice">$7</span>
            </div>
        <div class="menuText">asv alvjn</div>
    </div>

    <div class="menuCard">
        <img src="Images/muffin.png" alt="Muffin" class="menuImage">
            <div class="menuRow">
                <span class="menuNumber">3.</span>
                <span class="menuName">Muffin</span>
                <span class="menuPrice">$7</span>
            </div>
        <div class="menuText">aljvlad</div>
    </div>

    <div class="menuCard">
        <img src="Images/Brownie.png" alt="Brownie" class="menuImage">
            <div class="menuRow">
                <span class="menuNumber">4.</span>
                <span class="menuName">Brownie</span>
                <span class="menuPrice">$4</span>
            </div>
        <div class="menuText">aslfjv</div>
    </div>

    <div class="menuCard">
        <img src="Images/Espresso.png" alt="Espresso" class="menuImage">
            <div class="menuRow">
                <span class="menuNumber">5.</span>
                <span class="menuName">Espresso</span>
                <span class="menuPrice">$9</span>
            </div>
        <div class="menuText">asfalkbs</div>
    </div>

    <div class="menuCard">
        <img src="Images/Latte.png" alt="Latte" class="menuImage">
            <div class="menuRow">
                <span class="menuNumber">6.</span>
                <span class="menuName">Latte</span>
                <span class="menuPrice">$9</span>
            </div>
        <div class="menuText">asvlkjbd</div>
    </div>

    <div class="menuCard">
        <img src="Images/Hotchocolate.png" alt="Hot Chocolate" class="menuImage">
            <div class="menuRow">
                <span class="menuNumber">7.</span>
                <span class="menuName">Hot Chocolate</span>
                <span class="menuPrice">$9</span>
            </div>
        <div class="menuText">asvksb</div>
    </div>

    <div class="menuCard">
        <img src="Images/cappuccino.png" alt="Cappuccino" class="menuImage">
            <div class="menuRow">
                <span class="menuNumber">8.</span>
                <span class="menuName">Cappuccino</span>
                <span class="menuPrice">$9</span>
            </div>
        <div class="menuText">savbsbn</div>
    </div>

</div>

    <button id="cartIcon" onclick="toggleCart()">
        <i class="fa-solid fa-cart-shopping"></i>
    </button>

    <div id="orderSidebar" class="hidden">
        <div id="orderPage">
            <div id="spaceForJavaScriptOutput"></div>

            <form onsubmit="return false;">
                <label for="nameField">Name:</label>
                <input type="text" id="nameField" name="formName" placeholder="Name"> 
                <br>
                <label for="itemField">Item:</label>
                <input type="text" id="itemField" placeholder="1-8">
                <input type="submit" value="Add Item" onClick="addItem()">
                <br>
                <label for="moneyField">Payment:</label>
                <input type="text" id="moneyField" name="formMoney" placeholder="$$$"> 
            </form>

            <form onsubmit="return false;">
                <input type="submit" value="Complete Order" onClick="goToReceipt()">
                <input type="submit" value="Restart Order" onClick="restartOrder()">
            </form>

            <div id="cartSummary"></div>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
