<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<title>Cafe Menu</title>
</head>
<body>

    <button id="cartIcon" onclick="toggleCart()">🛒 Cart</button>

    <!---------------------------- Order Sidebar ----------------------------->
    <div id="orderSidebar" class="hidden">
        <div id="orderPage">
            <div id="spaceForJavaScriptOutput"></div>

            <form onsubmit="return false;">
                <label for="nameField">Name:</label>
                <input type="text" id="nameField" name="formName" placeholder="Name"> 
                <br>
                <label for="itemField">Item:</label>
                <input type="text" id="itemField" placeholder="1-8">
                <input type="submit" value="Add Item" onClick="addItem()">
                <br>
                <label for="moneyField">Payment:</label>
                <input type="text" id="moneyField" name="formMoney" placeholder="$$$"> 
            </form>

            <form onsubmit="return false;">
                <input type="submit" value="View Receipt" onClick="goToReceiptPage()">
                <input type="submit" value="Restart Order" onClick="restartOrder()">
            </form>
        </div>
    </div>

    <!---------------------------- Receipt ----------------------------->
    <div id="receiptPage" class="hidden">
      <div id="receiptOutput"></div>
      <button onclick="goToOrderPage()">Back to Order</button>
    </div>

<script src="script.js"></script>
</body>
</html>
