<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<title>Receipt</title>
</head>
<body>

<!-- Receipt displays the customer's completed order after payment. -->
    <div class="receipt">

<!-- Receipt heading -->
        <h2>Receipt</h2>
        <h3>Cafe</h3>
<!-- Displays the customer's name -->
        <p>Name: <span id="receiptName"></span></p>

<!-- Table showing each item that was ordered -->
        <table>
 <!-- Table headings -->
            <tr>
                <th>Quantity</th>
                <th>Item</th>
                <th>Price</th>
            </tr>
<!-- JavaScript adds the ordered items here -->
            <tbody id="receiptRows"></tbody>
        </table>

<!-- Displays the order total, payment amount and change -->
        <p>Total Cost: $<span id="receiptTotal"></span></p>
        <p>Money: $<span id="receiptMoney"></span></p>
        <p>Change: $<span id="receiptChange"></span></p>

<!-- Returns the user to the ordering page -->
        <a href="order.html">Restart Order</a>
    </div>

<!-- Links the JavaScript file that loads the receipt information -->
<script src="receipt.js"></script>
</body>
</html>
